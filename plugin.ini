[info]
name="Collection Tree Select"
author="Raphael Halff"
description="Companion to Collection Tree. Turns the flat Collection dropdowns into a searchable, indented tree picker, colour-coded by top-level collection, and tints Collection Tree's own tree page to match. Also restores the subcollections that Collection Tree strips out of the public advanced search. Admin only until you opt the public site in; degrades to plain indented options without JavaScript."
license="GPLv3"
link="https://github.com/raphihalff/omeka-plugin-CollectionTreeSelect"
support_link="https://github.com/raphihalff/omeka-plugin-CollectionTreeSelect/issues"
version="1.4"
omeka_minimum_version="2.0"
omeka_target_version="3.2"
required_plugins="CollectionTree"
tags="tree,collections,subcollections,search,accessibility"
